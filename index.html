<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Creazione Relè e Contattori</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    padding:15px;
}

h1{
    text-align:center;
}

.box{

    background:white;

    padding:15px;

    margin-bottom:15px;

    border-radius:12px;

    box-shadow:0 2px 8px rgba(0,0,0,.10);

}

label{

    display:block;

    margin-top:10px;

    font-weight:bold;

}

input,
select,
textarea{

    width:100%;

    padding:10px;

    margin-top:5px;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    margin-top:10px;

    font-size:18px;

    border:none;

    border-radius:10px;

    background:#0066cc;

    color:white;

    cursor:pointer;

}

button:hover{

    background:#0050a0;

}

.contatto{

    border:1px solid #ccc;

    padding:12px;

    margin-top:15px;

    border-radius:10px;

    background:#fafafa;

}

.sticky{

    position:sticky;

    top:10px;

    z-index:1000;

    background:#eef5ff;

    border-left:6px solid #0066cc;

}

#riepilogo{

    white-space:pre-line;

    line-height:1.5;

}

</style>

</head>

<body>

<h1>COMPONENTE</h1>

<div class="box">

<button onclick="window.location.href='index.html'">

← TORNA AL MENU

</button>

</div>

<div class="box sticky">

<h3>RIEPILOGO COMPONENTE</h3>

<div id="riepilogo">

NESSUN DATO

</div>

</div>

<div class="box">

<h3>DATI COMPONENTE</h3>

<label>Tipo Componente</label>

<select id="tipoComponente">

<option>Relè 2 contatti</option>
<option>Relè 4 contatti</option>
<option>Mini Contattore</option>
<option>Contattore</option>

</select>

<label>Sigla</label>

<input
id="sigla"
type="text"
placeholder="RFC"
oninput="aggiornaRiepilogo()">

<label>Descrizione</label>

<input
id="descrizione"
type="text"
placeholder="Relè Fine Sicurezze"
oninput="aggiornaRiepilogo()">

<label>Tensione Bobina</label>

<input
id="bobina"
type="text"
placeholder="48 Vac"
oninput="aggiornaRiepilogo()">

<label>Diodo</label>

<select
id="diodo"
onchange="aggiornaRiepilogo()">

<option>No</option>
<option>Si</option>

</select>

<label>Filtro</label>

<select
id="filtro"
onchange="aggiornaRiepilogo()">

<option>No</option>
<option>Si</option>

</select>

<label>Taglia</label>

<input
id="taglia"
type="text"
placeholder="9A / 12A / 18A"
oninput="aggiornaRiepilogo()">

</div>

<div class="box">

<h3>CONTATTI</h3>

<div id="contenitoreContatti"></div>

<button onclick="aggiungiContatto()">

+ AGGIUNGI CONTATTO

</button>

</div>

<div class="box">

<h3>CAMPI FUTURI</h3>

<input type="text" placeholder="Campo libero 1">
<br><br>

<input type="text" placeholder="Campo libero 2">
<br><br>

<input type="text" placeholder="Campo libero 3">
<br><br>

<input type="text" placeholder="Campo libero 4">
<br><br>

<input type="text" placeholder="Campo libero 5">

</div>

<button onclick="salvaComponente()">

SALVA COMPONENTE

</button>

<script>

let numeroContatto = 0;

function aggiungiContatto(){

    numeroContatto++;

    const html = `

    <div class="contatto">

        <h4>Contatto ${numeroContatto}</h4>

        <label>Tipo Contatto</label>

        <select
            class="tipoContatto"
            onchange="aggiornaRiepilogo()">

            <option>N.O.</option>
            <option>N.C.</option>
            <option>Scambio</option>
            <option>N.O. Potenza</option>
            <option>N.C. Potenza</option>

        </select>

        <label>Pagina Schema</label>

        <input
        type="text"
        placeholder="Pag. 4">

        <label>Posizione Schema</label>

        <input
        type="text"
        placeholder="D5">

        <label>Funzione</label>

        <input
        type="text"
        placeholder="Abilitazione Marcia">

    </div>

    `;

    document
    .getElementById("contenitoreContatti")
    .insertAdjacentHTML(
        "beforeend",
        html
    );

    aggiornaRiepilogo();

}

function aggiornaRiepilogo(){

    let no = 0;
    let nc = 0;
    let sc = 0;
    let noPot = 0;
    let ncPot = 0;

    document
    .querySelectorAll(".tipoContatto")
    .forEach(c => {

        switch(c.value){

            case "N.O.":
                no++;
                break;

            case "N.C.":
                nc++;
                break;

            case "Scambio":
                sc++;
                break;

            case "N.O. Potenza":
                noPot++;
                break;

            case "N.C. Potenza":
                ncPot++;
                break;

        }

    });

    let elenco = [];

    if(no > 0)
        elenco.push(`${no} N.O.`);

    if(nc > 0)
        elenco.push(`${nc} N.C.`);

    if(sc > 0)
        elenco.push(`${sc} SCAMBIO`);

    if(noPot > 0)
        elenco.push(`${noPot} N.O. POTENZA`);

    if(ncPot > 0)
        elenco.push(`${ncPot} N.C. POTENZA`);

    const sigla =
        document.getElementById("sigla").value;

    const descrizione =
        document.getElementById("descrizione").value;

    const bobina =
        document.getElementById("bobina").value;

    const diodo =
        document.getElementById("diodo").value;

    const filtro =
        document.getElementById("filtro").value;

    const taglia =
        document.getElementById("taglia").value;

    document.getElementById("riepilogo").innerHTML =

`
<b>${sigla || "COMPONENTE NON DEFINITO"}</b>

${descrizione}

${bobina ? "Bobina: " + bobina : ""}

${elenco.join("<br>")}

${diodo === "Si" ? "Diodo: SI" : ""}

${filtro === "Si" ? "Filtro: SI" : ""}

${taglia ? "Taglia: " + taglia : ""}
`;

}

function salvaComponente(){

    alert(
        "Versione test.\n\n" +
        "Successivamente verrà salvato nel LocalStorage."
    );

}

aggiungiContatto();

</script>

</body>

</html>
``
