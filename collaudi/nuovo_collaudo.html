<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Collaudo Ascensori</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    touch-action:manipulation;
    overscroll-behavior:none;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f0f2f5;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.box{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.10);
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input[type=text],
select,
textarea{
    width:100%;
    padding:12px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:8px;
    min-height:55px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.checkbox input{
    width:24px;
    height:24px;
}

.warning{
    background:#fff3cd;
    border-left:6px solid orange;
}

.warning h3{
    color:#b35c00;
    margin-bottom:10px;
}

button{
    width:100%;
    min-height:65px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#dettagliImpianto{
    margin-top:15px;
    padding:12px;
    background:#eef5ff;
    border-left:5px solid #0066cc;
    border-radius:8px;
    white-space:pre-line;
}

</style>

</head>

<body>

<div class="container">

<h1>NUOVO COLLAUDO</h1>

<!-- CLIENTE -->

<div class="box">

<label>Cliente</label>

<select id="cliente" class="autosave">
    <option>Cliente 1</option>
    <option>Cliente 2</option>
    <option>Cliente 3</option>
</select>

</div>

<!-- IMPIANTO -->

<div class="box">

<label>Tipo Impianto</label>

<select id="impianto" class="autosave">

    <option value="AUT230">
        AUT 230
    </option>

    <option value="MAN230">
        MAN 230
    </option>

    <option value="AUT400">
        AUT 400
    </option>

</select>

<div id="dettagliImpianto">

Impianto Automatico

Tensione: 230 Vac

Porte: Automatiche

Rescue: Presente

Scheda: Standard

</div>

<div class="checkbox">

<input
type="checkbox"
id="altro"
class="autosave">

<label for="altro">
Mostra impianti non abituali
</label>

</div>

</div>

<!-- RIF INTERNO -->

<div class="box">

<label>Riferimento Interno</label>

<input
type="text"
id="rifInterno"
class="autosave">

</div>

<!-- RIF CLIENTE -->

<div class="box">

<label>Riferimento Cliente</label>

<input
type="text"
id="rifCliente"
class="autosave">

</div>

<!-- APPUNTI -->

<div class="box">

<label>Appunti</label>

<textarea
id="appunti"
class="autosave"></textarea>

</div>

<!-- WARNING -->

<div class="box warning">

<h3>⚠ WARNING</h3>

<textarea
id="warning"
class="autosave"></textarea>

</div>

<button onclick="creaCollaudo()">
CREA COLLAUDO
</button>

</div>

<script>

/* ------------------------
   BLOCCO PULL TO REFRESH
------------------------ */

let startY = 0;

document.addEventListener(
'touchstart',
e => {
    startY = e.touches[0].clientY;
},
{ passive:false }
);

document.addEventListener(
'touchmove',
e => {

    let currentY =
    e.touches[0].clientY;

    if(
        window.scrollY === 0 &&
        currentY > startY
    ){
        e.preventDefault();
    }

},
{ passive:false }
);

/* ------------------------
   DETTAGLI IMPIANTI
------------------------ */

const dettagliImpianti = {

AUT230:

`Impianto Automatico

Tensione: 230 Vac

Porte: Automatiche

Rescue: Presente

Scheda: Standard`,

MAN230:

`Impianto Manuale

Tensione: 230 Vac

Porte: Manuali

Rescue: Assente

Scheda: MAN230`,

AUT400:

`Impianto Automatico

Tensione: 400 Vac

Porte: Automatiche

Rescue: Presente

Scheda: AUT400`

};

/* ------------------------
   AGGIORNA DETTAGLI
------------------------ */

function aggiornaDettagliImpianto(){

    const impianto =
    document.getElementById("impianto").value;

    document.getElementById(
        "dettagliImpianto"
    ).innerText =
    dettagliImpianti[impianto];

}

/* ------------------------
   AUTOSALVATAGGIO
------------------------ */

function salvaDati(){

    const dati = {

        cliente:
        document.getElementById("cliente").value,

        impianto:
        document.getElementById("impianto").value,

        altro:
        document.getElementById("altro").checked,

        rifInterno:
        document.getElementById("rifInterno").value,

        rifCliente:
        document.getElementById("rifCliente").value,

        appunti:
        document.getElementById("appunti").value,

        warning:
        document.getElementById("warning").value

    };

    localStorage.setItem(
        "collaudo_corrente",
        JSON.stringify(dati)
    );

}

/* ------------------------
   RIPRISTINO DATI
------------------------ */

function caricaDati(){

    const salvato =
    localStorage.getItem(
        "collaudo_corrente"
    );

    if(!salvato) return;

    const dati =
    JSON.parse(salvato);

    document.getElementById("cliente").value =
    dati.cliente || "";

    document.getElementById("impianto").value =
    dati.impianto || "AUT230";

    document.getElementById("altro").checked =
    dati.altro || false;

    document.getElementById("rifInterno").value =
    dati.rifInterno || "";

    document.getElementById("rifCliente").value =
    dati.rifCliente || "";

    document.getElementById("appunti").value =
    dati.appunti || "";

    document.getElementById("warning").value =
    dati.warning || "";

}

/* ------------------------
   EVENTI AUTOSAVE
------------------------ */

document.querySelectorAll(".autosave")
.forEach(campo => {

    campo.addEventListener(
        "input",
        salvaDati
    );

    campo.addEventListener(
        "change",
        salvaDati
    );

});

/* ------------------------
   AVVIO
------------------------ */

document.addEventListener(
"DOMContentLoaded",
function(){

    caricaDati();

    aggiornaDettagliImpianto();

}
);

/* ------------------------
   CAMBIO IMPIANTO
------------------------ */

document.getElementById("impianto")
.addEventListener(
"change",
function(){

    aggiornaDettagliImpianto();

    salvaDati();

}
);

/* ------------------------
   AVVISO USCITA
------------------------ */

window.addEventListener(
"beforeunload",
function(e){

    e.preventDefault();

    e.returnValue = "";

}
);

/* ------------------------
   CREA COLLAUDO
------------------------ */

function creaCollaudo(){

    alert(
        "COLLAUDO CREATO\n\n" +
        "Prossimo step:\n" +
        "apertura schermata esecuzione prove."
    );

}

</script>

</body>
</html>
